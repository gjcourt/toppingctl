<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>toppingctl rooms — prototype r2 (sample data)</title>
<!--
  Prototype r2: TOPPINGCTL-10 (volume without a preview), completed for the
  architecture plan's build step 3 by TOPPINGCTL-12 (gain, the room states,
  the "DAC volume" label, wake reading the level back). A single self-contained
  file: no network requests, nothing talks to a DAC. Every room, host and value
  is invented. r1 (prototype-r1.html) is kept unchanged.

  Volume changes send without a preview: the UI shows the target at once, sends
  the latest target after 300 ms of quiet, keeps one write in flight per room,
  and the (simulated) agent re-reads the device before each write. The -10 dB
  unlock is a checkbox that lasts 60 s: it ends at the cap, on Cancel, on
  unticking, or on leaving the room. Gain, presets and power keep the preview
  bar; high gain needs the same unlock (decision 8). Scene recall is absent
  (Q15).

  George's answers to the #40 questions (TOPPINGCTL-12, 2026-11-08), applied by
  TOPPINGCTL-14: the room page opens on DAC volume, with headphone gain, power
  and EQ preset behind a More disclosure (Q5). The one 60 s unlock names both
  things it permits (Q6). "Lower to -30 dB" re-reads and lowers whenever the
  room is louder than -30 dB, and is never refused as Changed elsewhere (Q8).
  Headphone gain shows only for models known to have a headphone output (Q9).
-->
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #1c1c1a; --muted: #5d5d58; --line: #d9d9d4;
    --accent: #2457c5; --accent-ink: #ffffff;
    --warn: #8a5300; --warn-bg: #fff3dc; --bad: #b3261e; --bad-bg: #fde9e7;
    --ok: #1e6b3a; --off-bg: #ececea;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --card: #1f1f1d; --ink: #ececea; --muted: #a8a8a2; --line: #3a3a37;
      --accent: #8fb0ff; --accent-ink: #0d1a33;
      --warn: #ffc86b; --warn-bg: #3a2b0f; --bad: #ff9c94; --bad-bg: #3d1916;
      --ok: #7fd49a; --off-bg: #2a2a28;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 14px 40px; }
  .num { font-variant-numeric: tabular-nums; }
  .sample {
    position: sticky; top: 0; z-index: 5; background: var(--warn-bg); color: var(--warn);
    border-bottom: 1px solid var(--line); padding: 6px 14px; font-size: 13px; text-align: center;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 0 8px; }
  header h1 { font-size: 22px; margin: 0; flex: 1; }
  .who { font-size: 13px; color: var(--muted); text-align: right; }
  button, .btn {
    font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 10px 14px; min-height: 44px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled, button[aria-disabled=true] { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .link { background: none; border: none; color: var(--accent); padding: 10px 4px; min-height: 44px; text-decoration: underline; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin: 10px 0;
  }
  a.card { display: block; color: inherit; text-decoration: none; }
  .row { display: flex; align-items: baseline; gap: 8px; }
  .row .grow { flex: 1; }
  .title { font-weight: 650; font-size: 18px; }
  .sub { color: var(--muted); font-size: 14px; }
  .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin-top: 8px; }
  .big { font-size: 30px; font-weight: 650; }
  .pill { font-size: 13px; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .pill.ok { color: var(--ok); }
  .pill.bad { color: var(--bad); }
  .pill.warn { color: var(--warn); }
  .pill.view { color: var(--muted); }
  .stale .val { color: var(--muted); }
  .prov { font-size: 13px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .dot.read { background: var(--ok); }
  .dot.written { border: 2px solid var(--muted); }
  .dot.unknown { width: 10px; height: 2px; border-radius: 0; background: var(--muted); vertical-align: 3px; }
  .banner { border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: 14px; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.info { background: var(--off-bg); color: var(--ink); }
  .banner button { margin-top: 8px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 6px; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; margin-top: 10px; }
  .stepper button { font-size: 22px; padding: 0; height: 56px; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 44px; }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .why { font-size: 13px; color: var(--muted); margin-top: 6px; }
  label.check { display: flex; gap: 10px; align-items: center; min-height: 44px; }
  label.check input { width: 22px; height: 22px; }
  .target { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .target .neg { font-size: 20px; font-weight: 600; margin-right: -4px; }
  .target input { font: inherit; width: 90px; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .err { color: var(--bad); font-size: 14px; margin-top: 6px; }
  .st { font-size: 15px; margin-top: 8px; }
  .st.sending { color: var(--accent); }
  .st.waiting { color: var(--warn); }
  .st.set { color: var(--ok); }
  .st.refused, .st.failed { color: var(--bad); }
  .preset { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; min-height: 44px; }
  .preset input { margin-top: 4px; width: 20px; height: 20px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .pending {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card);
    border-top: 2px solid var(--accent); box-shadow: 0 -6px 20px rgb(0 0 0 / .15);
  }
  .pending .in { max-width: 520px; margin: 0 auto; padding: 12px 14px 16px; max-height: 70vh; overflow-y: auto; }
  .pending .tag { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
  .pending .what { font-size: 18px; font-weight: 600; margin: 4px 0; }
  .pending .acts { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 10px; }
  details { font-size: 13px; color: var(--muted); }
  pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace; margin: 6px 0 0; }
  button.more { display: block; width: 100%; text-align: left; margin: 22px 0 0; padding: 12px 14px; }
  .more-name { display: block; font-weight: 650; }
  .proto { margin-top: 36px; border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px; font-size: 14px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>

<body>
<div class="sample" role="note">Prototype r2 · <strong>sample data</strong>. Rooms, hosts and values are invented. Nothing here talks to a DAC.</div>
<div class="wrap">
  <main id="app"></main>
  <div id="pending" class="pending" hidden></div>
  <div id="proto"></div>
  <div id="live" aria-live="polite" style="position:absolute;left:-9999px"></div>
</div>

<script>
"use strict";
const MINUS = "−";
const SAFE_MAX = -10;      // AGENTS.md: above -10 dB needs an explicit force
const VOL_MIN = -99;
const LOWER_TO = -30;      // the one-tap "Lower to -30 dB" (design rule 5, Q13)
const DEBOUNCE_MS = 300;   // quiet time before the latest volume target is sent
const UNLOCK_S = 60;       // the unlock checkbox times out
const BUSY_MS = 8000;      // how long the sample CLI holds the Office lock
// Q6: one unlock, worded so it names both things it permits, wherever it appears.
const UNLOCK_NAME = "Allow high gain or above " + MINUS + "10 dB";
const UNLOCK_LABEL = UNLOCK_NAME + " for 60 s";
const LOUD_MSG = "Above " + MINUS + "10 dB needs “" + UNLOCK_NAME + "” first.";
const DAC_VOL_DEF = "The DAC's own volume. Snapcast and Home Assistant set a second level in series that this page doesn't show, so this isn't the level at your ears.";

// Real preset files from presets/ (names from presets/README.md). Which one a
// room "has" is invented sample data.
const PRESETS = [
  { id: "flat", name: "Flat: no correction", detail: "All bands off. The preamp is left as it is", pre: null },
  { id: "e3-oratory-harman-oe", name: "Dan Clark Audio E3 · Harman OE", detail: "10 filters, preamp " + MINUS + "1.1 dB", pre: -1.1 },
  { id: "sundara-post2020pads-oratory-harman-oe", name: "HiFiMan Sundara · Harman OE", detail: "10 filters, preamp " + MINUS + "6.7 dB", pre: -6.7 },
  { id: "zero-red-crinacle-harman-ie", name: "Truthear Zero:RED · Harman IE", detail: "10 filters, preamp " + MINUS + "3.3 dB", pre: -3.3 },
];

// Q9: models known to have a headphone output, and what that rests on. The
// headphone gain section shows only for these; any other model, or an
// unrecognised DAC, doesn't get it.
const HEADPHONE_OUT = {
  "Topping DX5 II": "headphone gain register 71 17 is confirmed in the protocol spec",
  "Topping DX1 II": "toppingctl.py's DX1 II notes record a front-panel high-gain setting",
};
const hasHeadphones = (r) => Object.hasOwn(HEADPHONE_OUT, r.model);

const VIEW_ONLY = "View only: this model isn't confirmed for toppingctl.";

// The room states from the architecture plan, "Room states". The pill is a short
// form; the one-line reason (stateLine) uses the plan's words.
const STATES = {
  ok: { pill: "Reachable", cls: "ok" },
  notread: { pill: "Not read", cls: "view" },
  down: { pill: "Unreachable", cls: "bad" },
  busy: { pill: "DAC busy", cls: "warn" },
  nodac: { pill: "No DAC", cls: "bad" },
  unrecognised: { pill: "Unrecognised DAC", cls: "view" },
  different: { pill: "Different DAC", cls: "warn" },
  readfail: { pill: "Read failed", cls: "bad" },
};

const unknown = (why) => ({ v: null, src: "unknown", why });
const NOT_READ = "not read: no confirmed read path for this model";

// `dev`, `devGain` and `devPower` are what the simulated device holds. The UI
// never reads them directly: it learns them only through a read, as the agent does.
function sampleRooms() {
  return [
    { id: "office", name: "Office", model: "Topping DX5 II", host: "office", status: "confirmed", state: "ok",
      dev: -32, devGain: "Low", devPower: "Awake",
      vol: { v: -32, src: "read", age: "12 s ago" }, step: { v: 0.5, src: "read" },
      output: { v: "Headphones, balanced", hp: true, src: "read", age: "12 s ago" },
      gain: { v: "Low", src: "read", age: "12 s ago" },
      power: { v: "Awake", src: "read", age: "12 s ago" },
      preset: { v: "e3-oratory-harman-oe", src: "written", age: "2 h ago" },
      preamp: { v: -1.1, src: "written", age: "2 h ago" } },
    { id: "living", name: "Living room", model: "Topping D90 III Discrete", host: "living-room", status: "unverified", state: "notread",
      product: "D90 III Discrete (sample product string)",
      vol: unknown(NOT_READ), step: unknown(NOT_READ), output: { v: null }, gain: unknown(NOT_READ),
      power: unknown(NOT_READ), preset: unknown(NOT_READ), preamp: unknown(NOT_READ) },
    { id: "bedroom", name: "Bedroom", model: "Topping DX1 II", host: "bedroom", status: "unverified", state: "ok",
      dev: -40,
      vol: { v: -40, src: "read", age: "8 s ago" }, step: unknown(),
      output: { v: "Headphones", hp: true, src: "read", age: "8 s ago" },
      gain: unknown("not read: write-only on this model"),
      power: unknown(), preset: unknown(), preamp: unknown() },
    { id: "den", name: "Den", model: "Topping DX5 II", host: "den", status: "confirmed", state: "busy",
      holder: "the toppingctl CLI", dev: -28,
      vol: { v: -28, src: "read", age: "40 s ago" }, step: { v: 0.5, src: "read" },
      output: { v: "Line out, balanced", hp: false, src: "read", age: "40 s ago" },
      gain: { v: "Low", src: "read", age: "40 s ago" },
      power: { v: "Awake", src: "read", age: "40 s ago" },
      preset: { v: "flat", src: "written", age: "1 day ago" }, preamp: unknown() },
    { id: "studio", name: "Studio", model: "Topping DX5 II", host: "studio", status: "confirmed", state: "down",
      lastSeen: "14 min ago", dev: -35,
      vol: { v: -35, src: "read", age: "14 min ago" }, step: { v: 0.5, src: "read" },
      output: { v: "Line out, single-ended", hp: false, src: "read", age: "14 min ago" },
      gain: { v: "Low", src: "read", age: "14 min ago" },
      power: { v: "Awake", src: "read", age: "14 min ago" },
      preset: { v: "flat", src: "written", age: "5 days ago" }, preamp: unknown() },
    { id: "kitchen", name: "Kitchen", model: "Unrecognised", host: "kitchen", status: "unknown", state: "unrecognised",
      product: "D50s (sample product string)",
      vol: unknown("not read: this DAC isn't in toppingctl's model list"), step: unknown(), output: { v: null },
      gain: unknown("not read"), power: unknown("not read"), preset: unknown("not read"), preamp: unknown("not read") },
    { id: "guest", name: "Guest room", model: "Topping D90 III Discrete", host: "guest", status: "unverified", state: "different",
      expect: "Topping DX5 II",
      vol: unknown(NOT_READ), step: unknown(), output: { v: null }, gain: unknown(NOT_READ),
      power: unknown(NOT_READ), preset: unknown(NOT_READ), preamp: unknown(NOT_READ) },
    { id: "snaptest", name: "snap-test", model: "No DAC", host: "snap-test", status: "unknown", state: "nodac",
      vol: unknown("no DAC"), step: unknown(), output: { v: null }, gain: unknown("no DAC"),
      power: unknown("no DAC"), preset: unknown("no DAC"), preamp: unknown("no DAC") },
  ];
}

let S;
function newRoomUi() { return { want: null, wantUnlock: null, wantLower: false, prior: null, flight: null, timer: null, msg: null, undoTo: null, burstBase: null, err: "", reading: false }; }
function reset() {
  if (S) {
    S.rooms.forEach((r) => clearTimeout(r.ui.timer));
    clearInterval(S.unlockTimer);
  }
  S = { view: "signin", room: null, rooms: sampleRooms(), pending: null, sending: false,
        unlock: false, unlockSeq: 0, unlockLeft: 0, unlockTimer: null, unlockNote: "",
        more: false, failNext: false, readFailNext: false, typed: "", typedErr: "", framesOpen: false, said: null, toast: null };
  S.rooms.forEach((r) => { r.ui = newRoomUi(); });
}
reset();

const $ = (s) => document.querySelector(s);
const esc = (s) => (s === null || s === undefined ? "Unknown" : String(s)).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const room = () => S.rooms.find((r) => r.id === S.room);
const writable = (r) => r.status === "confirmed" && r.state === "ok";
const asleep = (r) => r.power.v === "Asleep";
const canVol = (r) => writable(r) && !asleep(r);
const anyVolumeOpen = () => S.rooms.some((x) => x.ui.flight !== null || x.ui.want !== null);
function db(v) {
  if (v === null || v === undefined) return "Unknown";
  return (v < 0 ? MINUS : v > 0 ? "+" : "") + Math.abs(v).toFixed(1) + " dB";
}
function say(msg) { $("#live").textContent = msg; }
const clock = () => new Date().toTimeString().slice(0, 8);
function plain(html) { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; }
function presetName(id) { const p = PRESETS.find((x) => x.id === id); return p ? p.name : "Unknown"; }

function prov(f, r) {
  const last = r && (r.state === "down" || r.state === "busy") ? " · last known"
    : r && asleep(r) && f !== r.power ? " · before it slept" : "";
  if (f.src === "read") return `<span class="prov"><span class="dot read"></span>Read from device · ${esc(f.age)}${last}</span>`;
  if (f.src === "written") return `<span class="prov"><span class="dot written"></span>Last written by toppingctl · ${esc(f.age)} · may be stale${last}</span>`;
  return `<span class="prov"><span class="dot unknown"></span>Unknown · ${esc(f.why || "not read yet")}</span>`;
}

// The output is read-only (decision 1), shown inline with where it came from, like every other value.
function outputText(r) {
  const o = r.output;
  if (o.v === null) return "Output unknown";
  const last = r.state === "down" || r.state === "busy" ? ", last known" : asleep(r) ? ", before it slept" : "";
  return `${o.v} (read ${o.age}${last})`;
}

function statePill(r) {
  const s = STATES[r.state];
  return `<span class="pill ${s.cls}">${s.pill}</span>`;
}

// One line saying why the room is in its state, in the plan's words.
function stateLine(r) {
  switch (r.state) {
    case "notread": return `${r.model} · ${NOT_READ}.`;
    case "down": return `Unreachable · ${r.host} · last seen ${r.lastSeen}.`;
    case "busy": return `DAC busy · in use by ${r.holder} on ${r.host}. The page checks again every 10 s.`;
    case "nodac": return `No DAC found on ${r.host}. Its agent answers, but no Topping DAC is plugged in.`;
    case "unrecognised": return `Unrecognised DAC: ${r.product}. Read-only.`;
    case "different": return `Different DAC than expected: ${r.model}. rooms.yaml expects a ${r.expect}. Read-only until rooms.yaml is edited.`;
    case "readfail": return `Read failed: ${r.readErr}. Values are unknown until a read works.`;
    default: return "";
  }
}

// Why a control is disabled, for the line under it.
function whyCant(r) {
  if (r.state === "down") return "Can't change: the host isn't answering. Nothing is queued for when it comes back.";
  if (r.state === "busy") return "Can't change while the DAC is busy. The controls come back when it's free.";
  if (r.state === "readfail") return "Can't change until a read works: every change starts from a fresh read.";
  if (r.state !== "ok") return "Read-only: " + stateLine(r);
  if (r.status !== "confirmed") return VIEW_ONLY;
  if (asleep(r)) return `Asleep. Wake ${r.name} to change this.`;
  return "";
}

// --- views -----------------------------------------------------------------

function viewSignin() {
  return `
  <header><h1>toppingctl</h1></header>
  <div class="card">
    <div class="title">Sign in</div>
    <p class="sub">Placeholder. The sign-in method is decided in the architecture plan (Authelia OIDC).</p>
    <button class="primary" style="width:100%" data-act="signin">Continue as george (sample)</button>
  </div>`;
}

function viewList() {
  const cards = S.rooms.map((r) => {
    const dim = r.state === "down" || r.state === "busy";
    const line = stateLine(r);
    const bad = r.state === "down" || r.state === "readfail" || r.state === "nodac";
    let values = "";
    if (r.vol.v !== null) {
      const pre = r.preset.v ? presetName(r.preset.v) + " (last written)" : "EQ preset unknown";
      values = `<div class="label">DAC volume</div>
        <div class="row"><span class="big num val">${esc(db(r.vol.v))}</span>${asleep(r) ? `<span class="sub">asleep</span>` : ""}</div>
        <div>${prov(r.vol, r)}</div>
        <div class="sub val" style="margin-top:6px">${esc(outputText(r))} · ${esc(pre)}</div>`;
    } else if (r.state === "ok" || r.state === "readfail") {
      values = `<div class="label">DAC volume</div><div class="val">Unknown</div><div>${prov(r.vol, r)}</div>`;
    }
    return `
    <a class="card ${dim ? "stale" : ""}" href="#${r.id}" data-act="open" data-id="${r.id}">
      <div class="row"><span class="title grow">${esc(r.name)}</span>
        ${r.state === "ok" && r.status !== "confirmed" ? `<span class="pill view">View only</span>` : ""} ${statePill(r)}</div>
      <div class="sub">${esc(r.model === "No DAC" || r.model === "Unrecognised" ? r.host : (r.product || r.model) + " · " + r.host)}</div>
      ${line ? `<div class="${bad ? "err" : "sub"}" style="margin-top:4px">${esc(line)}</div>` : ""}
      ${values}
    </a>`;
  }).join("");
  return `
  <header><h1>Rooms</h1><div class="who">george (sample)<br>via LAN (sample) · <button class="link" data-act="signout">Sign out</button></div></header>
  ${cards}`;
}

function viewRoom() {
  const r = room();
  let banner = "";
  if (r.state === "down") {
    banner = `<div class="banner bad" role="status"><strong>Unreachable.</strong> ${esc(r.host)} isn't answering; last seen ${esc(r.lastSeen)}.
      The values below are the last known ones, and nothing can be changed until it answers.</div>`;
  } else if (r.state === "busy") {
    banner = `<div class="banner warn" role="status"><strong>DAC busy.</strong> In use by ${esc(r.holder)} on ${esc(r.host)}.
      The values below are from the last read, and nothing can be changed until it's free. The page checks again every 10 s.</div>`;
  } else if (r.state === "readfail") {
    banner = `<div class="banner bad" role="status"><strong>Read failed.</strong> ${esc(r.readErr)}.
      The values are unknown until a read works, so nothing can be changed. <br><button data-act="read" ${r.reading ? "disabled" : ""}>${r.reading ? "Reading " + esc(r.host) + "…" : "Read " + esc(r.name) + " again"}</button></div>`;
  } else if (r.state !== "ok") {
    banner = `<div class="banner info" role="status"><strong>${STATES[r.state].pill}.</strong> ${esc(stateLine(r))}
      This page can't change anything here.</div>`;
  } else if (r.status !== "confirmed") {
    banner = `<div class="banner info"><strong>View only.</strong> The ${esc(r.model)} isn't confirmed for toppingctl, so this page can't change anything on it.</div>`;
  } else if (asleep(r)) {
    // Wake lives under More with power, so the banner offers it too: asleep, it's the only change there is.
    banner = `<div class="banner info"><div role="status"><strong>Asleep</strong>, as last sent from this page. What the DAC reports while asleep hasn't been measured yet, so the values below are from before it slept. Wake it to change anything.</div>
      <button data-act="power" data-to="wake" id="wake-banner" ${S.sending ? "disabled" : ""}>Wake ${esc(r.name)} (shows a preview)</button></div>`;
  }
  const identity = r.product ? `${esc(r.product)} · ${esc(r.host)}` : `${esc(r.model)} · ${esc(r.host)}`;
  if (r.state === "nodac") {
    return `
    <header><button data-act="back" aria-label="Back to rooms">‹ Rooms</button>
      <div style="flex:1"><h1>${esc(r.name)}</h1><div class="sub">${esc(r.host)}</div></div>${statePill(r)}</header>
    ${banner}
    <div class="card"><div>No Topping DAC is plugged into ${esc(r.host)}, and no other unrecognised USB audio device was found. Plug the DAC in; the page notices on its next check.</div>
      <div class="why">If the DAC is plugged into another computer, this is what the page shows.</div></div>`;
  }
  return `
  <header><button data-act="back" aria-label="Back to rooms" ${S.sending ? "disabled" : ""}>‹ Rooms</button>
    <div style="flex:1"><h1>${esc(r.name)}</h1><div class="sub">${identity}</div></div>${statePill(r)}</header>
  ${banner}
  ${S.toast && S.toast.room === r.id ? `<div class="banner ${S.toast.kind}" id="toast">${S.toast.html}</div>` : ""}
  <h2>DAC volume</h2>
  <div class="card ${r.state === "down" || r.state === "busy" ? "stale" : ""}" id="volcard">${volumeCard(r)}</div>
  ${moreBlock(r)}`;
}

// Q5: volume on top, the rest one level down. The closed button names what's
// inside and its current values, so nothing has to be opened just to see it.
function moreBlock(r) {
  const names = (hasHeadphones(r) ? ["headphone gain"] : []).concat(["power", "EQ preset"]);
  const now = (hasHeadphones(r) ? [r.gain.v === null ? "gain unknown" : r.gain.v + " gain"] : [])
    .concat([r.power.v === null ? "power unknown" : r.power.v + (r.power.src === "written" ? " (as last sent)" : ""),
      r.preset.v ? presetName(r.preset.v) + " (last written)" : "EQ preset unknown"]);
  const last = r.state === "down" || r.state === "busy" ? " · last known"
    : asleep(r) && hasHeadphones(r) ? " · gain read before it slept" : "";
  const label = "More: " + names.join(", ");
  let html = `<button class="more" id="more" data-act="more" aria-expanded="${S.more}"${S.more ? ` aria-controls="more-body"` : ""}>
      <span class="more-name">${S.more ? "▾" : "▸"} ${esc(label)}</span>
      <span class="sub">${esc(now.join(" · ") + last)}</span></button>`;
  if (!S.more) return html;
  html += `<div id="more-body">`;
  if (hasHeadphones(r)) html += `<h2>Headphone gain</h2><div class="card">${gainBlock(r)}</div>`;
  html += `<h2>Power</h2><div class="card">${powerBlock(r)}</div>
    <h2>EQ preset</h2><div class="card">${presetBlock(r)}</div>`;
  if (!hasHeadphones(r)) {
    html += `<div class="why">No headphone gain here: ${esc(r.model === "Unrecognised" ? "this DAC isn't in toppingctl's model list" : "toppingctl doesn't know of a headphone output on the " + r.model)}.</div>`;
  }
  return html + `</div>`;
}

// --- volume: send without a preview, debounced ------------------------------
// The target a room is heading for is r.ui.want (waiting for input to settle)
// or r.ui.flight (being sent). Only one write is in flight per room. The value
// on screen as the device's is r.vol, and only a read changes it.

function stepOf(r) { return r.step.v || 0.5; }      // 0.5 is only for rounding; steps stay disabled until read
function roundTo(r, to) { const s = stepOf(r); return Math.round(to / s) * s; }
function displayed(r) { return r.ui.want ?? r.ui.flight ?? r.vol.v; }
// Above -10 dB needs the unlock, unless the target is quieter than the level the
// device last reported. `base` is the device's level as known at that point.
function loudError(base, to, unlocked) {
  if (to < VOL_MIN) return "The quietest setting is " + MINUS + "99.0 dB.";
  if (to > SAFE_MAX && to > (base ?? SAFE_MAX) && !unlocked) return LOUD_MSG;
  return null;
}
function capOf(base) {
  if (S.unlock) return 0;
  return base !== null && base > SAFE_MAX ? base : SAFE_MAX;
}

function request(r, raw) {
  const base = r.vol.v, prevErr = r.ui.err;
  const to = roundTo(r, raw);
  r.ui.undoTo = null;
  r.ui.err = (r.step.v === null ? "Read the device first: its step size isn't known yet."
    : loudError(base, raw, S.unlock) || loudError(base, to, S.unlock)) || "";
  if (r.ui.err) { if (r.ui.err !== prevErr) say(r.ui.err); refreshVolume(); return; }
  if (r.ui.flight === null && r.ui.want === null) r.ui.burstBase = base;
  r.ui.wantLower = false; r.ui.prior = null;   // input after "Lower to -30 dB" replaces it
  if (to === base && r.ui.flight === null) {
    clearTimeout(r.ui.timer); r.ui.timer = null; r.ui.want = null;
    r.ui.msg = { kind: "none" };
  } else {
    r.ui.want = to;
    r.ui.wantUnlock = S.unlock ? S.unlockSeq : null;
    r.ui.msg = { kind: "waiting" };
    if (r.ui.flight === null) {
      clearTimeout(r.ui.timer);
      r.ui.timer = setTimeout(() => flush(r), DEBOUNCE_MS);
    }
  }
  refreshVolume();
}

function flush(r) {
  r.ui.timer = null;
  if (r.ui.flight !== null || r.ui.want === null) return;
  const to = r.ui.want, expected = r.vol.v, unlock = r.ui.wantUnlock, lower = r.ui.wantLower;
  r.ui.want = null; r.ui.wantLower = false;
  r.ui.flight = to;
  r.ui.msg = { kind: "sending" };
  refreshVolume();
  say("Sending " + db(to) + " to " + r.host + ".");
  // Agent side: take the device lock, read the device, check it, write, read back.
  setTimeout(() => {
    if (r.state === "busy") {
      return settle(r, { kind: "refused",
        text: `DAC busy: ${r.name} is in use by ${r.holder}. Set the level again when it's free.` });
    }
    if (r.state !== "ok" || r.devPower === "Asleep") {
      return settle(r, { kind: "refused", text: `${r.name} can't take a volume change now: ${r.state !== "ok" ? stateLine(r) : "it's asleep."}` });
    }
    const fresh = r.dev, readAt = clock();
    // Q8: Lower doesn't compare with the expected level. It lowers whenever the
    // fresh read is louder than -30 dB, and sends nothing when it isn't.
    if (lower && fresh <= LOWER_TO) {
      return settle(r, { kind: "quiet", fresh, readAt });
    }
    if (!lower && fresh !== expected) {
      return settle(r, { kind: "refused", fresh, readAt,
        text: `Changed elsewhere: ${r.name} reads ${db(fresh)}, not the ${db(expected)} this change started from. The level above is that fresh read; set the level again from there.` });
    }
    const err = loudError(fresh, to, S.unlock && unlock === S.unlockSeq);
    if (err) return settle(r, { kind: "refused", fresh, readAt, text: err });
    setTimeout(() => {
      if (S.failNext) {
        S.failNext = false;
        return settle(r, { kind: "failed", fresh, readAt, error: "no answer from " + r.host + " within 10 s" });
      }
      r.dev = to;
      settle(r, { kind: "set", v: r.dev, lowered: lower ? { from: fresh, moved: fresh !== expected } : null });
    }, 800);
  }, 900);
}

function settle(r, res) {
  r.ui.flight = null;
  if (res.kind === "set") {
    r.vol = { v: res.v, src: "read", age: "just now" };
    r.ui.msg = { kind: "set", lowered: res.lowered };
    if (res.lowered) r.ui.burstBase = res.lowered.from;   // undo goes back to the level it actually lowered from
    if (r.ui.want === r.vol.v) { r.ui.want = null; r.ui.wantLower = false; }   // queued input already matches the device
    if (r.ui.want !== null) { flush(r); refreshVolume(); return; }   // input that arrived during the write goes next
    r.ui.undoTo = r.ui.burstBase !== r.vol.v ? r.ui.burstBase : null;
  } else {
    if (res.fresh !== undefined) r.vol = { v: res.fresh, src: "read", age: "at " + res.readAt };  // a busy refusal read nothing
    r.ui.msg = res;
    if (r.ui.wantLower) {           // a queued Lower still goes: it doesn't depend on the old value
      say(plain(statusHtml(r)));
      r.ui.prior = res;             // and the refusal stays on screen above its result
      flush(r); return;
    }
    r.ui.want = null;               // input typed against the old value is dropped
    r.ui.wantLower = false;
    clearTimeout(r.ui.timer); r.ui.timer = null;
  }
  refreshVolume();
  say(plain(statusHtml(r)));
}

function cancelVol(r) {
  if (r.ui.want === null) return;
  const inFlight = r.ui.flight !== null;
  clearTimeout(r.ui.timer); r.ui.timer = null; r.ui.want = null; r.ui.wantLower = false;
  r.ui.msg = { kind: "cancelled" };
  relock();
  refreshVolume();
  say(inFlight ? "Queued change cancelled. The write already being sent may still land." : "Cancelled. Nothing was sent.");
}

function setUnlock(on) {
  if (!on) { relock(); return; }
  S.unlock = true; S.unlockSeq += 1; S.unlockLeft = UNLOCK_S; S.unlockNote = "";
  clearInterval(S.unlockTimer);
  S.unlockTimer = setInterval(() => {
    S.unlockLeft -= 1;
    if (S.unlockLeft <= 0) { relock(); S.unlockNote = `The unlock ran out after ${UNLOCK_S} s.`; say(S.unlockNote); }
    refreshVolume();
    refreshBarUnlock();
  }, 1000);
}
function relock() {
  S.unlock = false; S.unlockNote = "";
  clearInterval(S.unlockTimer); S.unlockTimer = null;
  renderPending();
}

// "Lower to -30 dB" goes at once: no unlock (it's quieter) and no quiet time.
// It isn't checked against the level on screen: the agent re-reads and lowers
// whenever the room is louder than -30 dB (Q8). Behind a write in flight, it
// goes next. The button goes away once the write starts, so focus moves to the
// level it changes.
function lowerNow(r) {
  if (!canVol(r)) {
    S.toast = { room: r.id, kind: "bad", html: `<strong>Not sent.</strong> ${esc(whyCant(r))}` };
    render(); say(plain(S.toast.html)); return;
  }
  r.ui.prior = null;
  clearTimeout(r.ui.timer); r.ui.timer = null;
  if (r.ui.flight === null && r.ui.want === null) r.ui.burstBase = r.vol.v;
  r.ui.err = ""; r.ui.undoTo = null;
  r.ui.want = LOWER_TO; r.ui.wantLower = true; r.ui.wantUnlock = null;
  r.ui.msg = { kind: "waiting" };
  if (r.ui.flight === null) flush(r); else refreshVolume();
  if (S.toast && S.toast.room === r.id && S.toast.loud) { S.toast = null; render("#vol-now"); }
  else $("#vol-now").focus();
}

function volumeCard(r) {
  let html = `<div class="big num" id="vol-now" tabindex="-1">${esc(db(r.vol.v))}</div>
    <div id="vol-prov">${prov(r.vol, r)}</div>
    <div class="why">${DAC_VOL_DEF}</div>`;
  if (!canVol(r)) {
    const why = whyCant(r);
    if (r.state === "ok" && r.status !== "confirmed" && r.dev !== undefined) html += readButton(r);
    if (r.vol.v === null) return html + `<div class="why">${esc(why)}</div><div id="vol-status"></div>`;
    return html + `<div class="stepper">
      <button disabled aria-label="${esc(r.name)}: quieter">${MINUS}</button>
      <input type="range" disabled aria-label="${esc(r.name)} DAC volume" min="${VOL_MIN}" max="0" value="${r.vol.v}">
      <button disabled aria-label="${esc(r.name)}: louder">+</button>
    </div><div class="why">${esc(why)}</div><div id="vol-status"></div>`;
  }
  html += readButton(r);
  if (r.vol.v === null) {
    return html + `<div class="why">The level isn't known yet. Read the device before changing it.</div><div id="vol-status"></div>`;
  }
  const step = r.step.v;
  return html + `
    <div id="vol-loud"></div>
    <div class="stepper">
      <button id="vol-down" data-act="step" data-dir="-1" aria-label="${esc(r.name)}: quieter, ${step === null ? "step unknown" : `by ${step} dB`}">${MINUS}</button>
      <div>
        <input type="range" id="slider" min="${VOL_MIN}" aria-label="${esc(r.name)} DAC volume">
        <div class="scale num"><span>${MINUS}99 dB</span><span id="vol-cap"></span></div>
      </div>
      <button id="vol-up" data-act="step" data-dir="1" aria-label="${esc(r.name)}: louder, ${step === null ? "step unknown" : `by ${step} dB`}">+</button>
    </div>
    <div class="why" id="vol-step-note"></div>
    <div class="target"><label for="tgt">Set to</label>
      <span class="neg num" aria-hidden="true">${MINUS}</span>
      <input id="tgt" type="text" class="num" inputmode="decimal" autocomplete="off" placeholder="30" aria-describedby="tgt-hint tgt-err" value="${esc(S.typed)}">
      <span>dB</span><button data-act="typed">Set</button></div>
    <div id="tgt-hint" class="why">Levels are below 0 dB, so type how far below: 32 means ${MINUS}32.0 dB.
      <span id="tgt-echo" class="num">${esc(echoTarget(S.typed))}</span></div>
    <div id="tgt-err" class="err">${esc(S.typedErr)}</div>
    <div id="vol-status"></div>
    <label class="check"><input type="checkbox" id="unlock" ${S.unlock ? "checked" : ""}>
      <span>${UNLOCK_LABEL}${r.output.hp ? " <strong>(output is headphones)</strong>" : ""}</span></label>
    <div id="unlock-note" class="why"></div>`;
}

// Reading is disabled while a change is waiting or being sent: a read then would
// race the write it was queued against.
function readButton(r) {
  const busy = r.reading || r.ui.flight !== null || r.ui.want !== null;
  return `<div style="margin-top:8px"><button data-act="read" id="read" ${busy ? "disabled" : ""}>${r.reading ? "Reading " + esc(r.host) + "…" : "Read " + esc(r.name) + " now"}</button></div>`;
}

function statusHtml(r) {
  const u = r.ui, m = u.msg || {};
  const lines = [];
  if (u.prior) {
    const pm = u.prior;
    lines.push(`<div class="st ${pm.kind}">Before Lower: ${pm.kind === "failed" ? `the write failed (${esc(pm.error)}) and may or may not have landed.` : `not sent. ${esc(pm.text)}`}</div>`);
  }
  if (u.flight !== null) lines.push(`<div class="st sending">Sending ${esc(db(u.flight))} to ${esc(r.host)}… not set yet.</div>`);
  if (u.want !== null) {
    lines.push(`<div class="st waiting">${u.flight !== null ? "Queued behind that write" : "Waiting for you to stop"}: ${esc(db(u.want))}. Not sent yet. <button class="link" data-act="cancelvol">Cancel</button></div>`);
  }
  if (u.flight === null && u.want === null) {
    if (m.kind === "set") {
      const lw = m.lowered;
      lines.push(`<div class="st set">Set to ${esc(db(r.vol.v))}, read back from the device.` +
        (lw && lw.moved ? ` Lower read ${esc(db(lw.from))} just before, not the level shown, and lowered from there.` : "") +
        (u.undoTo !== null ? ` <button class="link" data-act="undo">Undo (back to ${esc(db(u.undoTo))})</button>` : "") + `</div>`);
    } else if (m.kind === "refused") {
      lines.push(`<div class="st refused">Not sent. ${esc(m.text)}</div>`);
    } else if (m.kind === "failed") {
      lines.push(`<div class="st failed">Failed: ${esc(m.error)}. ${esc(r.name)} reads ${esc(db(r.vol.v))} (read at ${esc(m.readAt)}, before the write). Check it before trying again.</div>`);
    } else if (m.kind === "quiet") {
      lines.push(`<div class="st">Nothing sent. ${esc(r.name)} reads ${esc(db(r.vol.v))} (read at ${esc(m.readAt)}), already at or below ${MINUS}30 dB.</div>`);
    } else if (m.kind === "cancelled") {
      lines.push(`<div class="st">Cancelled. Nothing was sent.</div>`);
    }
  }
  if (u.err) lines.push(`<div class="err">${esc(u.err)}</div>`);
  return lines.join("");
}

// Updates the volume card in place, so a slider drag isn't interrupted by a re-render.
function refreshVolume() {
  const r = room();
  if (!r || S.view !== "room" || !$("#vol-now")) return;
  $("#vol-now").textContent = db(r.vol.v);
  $("#vol-prov").innerHTML = prov(r.vol, r);
  $("#vol-status").innerHTML = statusHtml(r);
  if ($("#read")) $("#read").disabled = r.reading || r.ui.flight !== null || r.ui.want !== null;
  const slider = $("#slider");
  if (!canVol(r) || r.vol.v === null || !slider) return;
  const shown = displayed(r), cap = capOf(r.vol.v), step = r.step.v;
  slider.max = Math.max(cap, shown);
  slider.step = step || 0.5;
  slider.disabled = step === null;
  slider.value = shown;
  slider.setAttribute("aria-valuetext", db(shown));
  const loudSending = r.ui.flight !== null && r.ui.flight > SAFE_MAX;
  $("#vol-cap").textContent = loudSending ? "loud send in progress" : S.unlock ? `unlocked, ${S.unlockLeft} s left` : cap > SAFE_MAX ? `now ${db(cap)}, quieter only` : `${MINUS}10 dB limit`;
  $("#vol-down").disabled = step === null || shown - step < VOL_MIN;
  $("#vol-up").disabled = step === null || shown + step > cap;
  $("#vol-step-note").textContent = step === null
    ? "The step size hasn't been read yet. Read the device before changing the level."
    : `Steps of ${step} dB, from the device's volumeStep. The step is read again before each write.`;
  // Design rule 5: whenever a read shows the room above -10 dB, offer the way down first.
  const wokeLoud = S.toast && S.toast.room === r.id && S.toast.loud;   // the wake message already offers it
  const loud = r.vol.v > SAFE_MAX && r.ui.flight === null && r.ui.want === null && !wokeLoud;
  $("#vol-loud").innerHTML = loud
    ? `<div class="banner warn">${esc(r.name)} reads ${esc(db(r.vol.v))}, above ${MINUS}10 dB. <br><button class="primary" data-act="lower">Lower to ${MINUS}30 dB now</button>
        <div class="why">It reads the DAC again first and lowers it if it's louder than ${MINUS}30 dB, even if the level has moved since.</div></div>`
    : "";
  $("#unlock").checked = S.unlock;
  $("#unlock-note").textContent = S.unlock
    ? `High gain and levels above ${MINUS}10 dB are allowed for ${S.unlockLeft} more s. It locks at the cap, on Cancel, when you untick it, leave the room or sign out.`
    : S.unlockNote;
  $("#tgt-err").textContent = S.typedErr;
}

// "Set to" takes a magnitude: every level is at or below 0 dB, and the iPhone
// decimal keypad has no minus key. "32" means -32 dB. An explicit minus (ASCII,
// U+2212 or an en dash) is accepted, a trailing "dB" is ignored, and a comma
// works as the decimal point. 0 stays 0 dB. Returns a number, or an error string.
function parseTarget(text) {
  let t = text.trim().replace(/\s*db$/i, "").replace(",", ".");
  if (t === "") return "Type a level, such as 30 for " + MINUS + "30 dB.";
  if (t.startsWith("+")) return "Levels are below 0 dB. Type 30 for " + MINUS + "30 dB.";
  t = t.replace(/^[-−–]\s*/, "");
  if (!/^\d+(\.\d*)?$|^\.\d+$/.test(t)) return "Type a level, such as 30 for " + MINUS + "30 dB.";
  const mag = Number(t);
  return mag === 0 ? 0 : -mag;
}

function echoTarget(text) {
  if (!text || !text.trim()) return "";
  const v = parseTarget(text);
  return typeof v === "number" ? "Reads as " + db(v) + "." : "";
}

// --- gain: preview first; switching to high needs the unlock (decision 8) ----

function gainBlock(r) {
  const g = r.gain;
  let html = `<div class="row"><span class="grow">${g.v === null ? "Unknown" : esc(g.v) + " gain"}</span></div><div>${prov(g, r)}</div>
    <div class="why">Gain applies to the headphone output (output: ${esc(outputText(r))}). High gain counts as loud, like going above ${MINUS}10 dB.</div>`;
  const why = whyCant(r);
  if (why) return html + `<div class="why">${esc(why)}</div>`;
  return html + `<div class="pair">
      <button data-act="gain" data-to="Low" ${g.v === "Low" ? "disabled" : ""}>Low gain</button>
      <button data-act="gain" data-to="High" ${g.v === "High" ? "disabled" : ""}>High gain</button></div>
    <div class="why">Gain changes show a preview before anything is sent.</div>`;
}

function stageGain(to) {
  const r = room();
  S.pending = { kind: "gain", to, from: r.gain.v,
    what: `${to} gain on ${r.name}`,
    note: (r.gain.v === null ? "Current gain unknown. The page hasn't read it, so it can't say whether this changes anything. " : "") +
      (to === "High" ? `High gain makes everything on the headphone output louder at the same ${MINUS}dB setting.` : ""),
    frames: `gain register 71 17 = ${to === "High" ? 1 : 0} (${to.toLowerCase()}), then the 71 34 commit. Two frames.` };
}

// --- power: preview first, then read after waking (Q13) ---------------------

function powerBlock(r) {
  const p = r.power;
  let html = `<div class="row"><span class="grow">${esc(p.v ?? "Unknown")}</span></div><div>${prov(p, r)}</div>`;
  const why = r.state !== "ok" || r.status !== "confirmed" ? whyCant(r) : "";
  if (why) return html + `<div class="why">${esc(why)}</div>`;
  return html + `<div class="pair">
      <button id="power-sleep" data-act="power" data-to="sleep" ${p.v === "Asleep" ? "disabled" : ""}>Sleep ${esc(r.name)}</button>
      <button id="power-wake" data-act="power" data-to="wake" ${p.v === "Awake" ? "disabled" : ""}>Wake ${esc(r.name)}</button></div>
    <div class="why">Sleep and wake show a preview before anything is sent. Waking resumes the level the DAC stored, so the page reads it straight after.</div>`;
}

function stagePower(sleep) {
  const r = room();
  S.pending = { kind: "power", to: sleep ? "sleep" : "wake",
    what: sleep ? `Put ${r.name} to sleep` : `Wake ${r.name}`,
    note: r.power.v === null ? "Current power state unknown. The page hasn't read it, so it can't say whether this changes anything." :
      sleep ? "" : `Waking resumes the level the DAC stored, which may not be the ${db(r.vol.v)} read before it slept. The page reads it after waking.`,
    frames: `power register 71 01 = ${sleep ? 0 : 1} (${sleep ? "sleep" : "wake"}), with the checksum the device requires. One frame; no commit.` };
}

// --- presets ------------------------------------------------------------------

function presetBlock(r) {
  const cur = r.preset.v;
  let html = `<div>${cur ? "Current: <strong>" + esc(presetName(cur)) + "</strong>" : "Current: <strong>Unknown</strong>"}</div>
    <div>${prov(r.preset, r)}</div>
    <div class="row" style="margin-top:6px"><span class="sub">Preamp</span><span class="num">${esc(db(r.preamp.v))}</span></div>
    <div>${prov(r.preamp, r)}</div>
    <div class="why">The DAC doesn't store preset names, so this is what toppingctl last wrote. Anything changed since on the front panel or in the vendor app won't show here.</div>`;
  const why = whyCant(r);
  if (why) return html + `<div class="why">${esc(why)}</div>`;
  html += `<fieldset style="border:none;padding:0;margin:8px 0 0"><legend class="sub">Apply a preset (shows a preview first)</legend>` +
    PRESETS.map((p) => {
      const sel = S.pending && S.pending.kind === "preset" ? S.pending.to === p.id : false;
      return `<label class="preset"><input type="radio" name="preset" value="${p.id}" ${sel ? "checked" : ""}>
        <span><span>${esc(p.name)}</span>${p.id === cur ? " <span class='pill view'>last written · re-apply</span>" : ""}<br><span class="sub">${esc(p.detail)}</span></span></label>`;
    }).join("") + `</fieldset>`;
  return html;
}

function stagePreset(id) {
  const r = room();
  const to = PRESETS.find((p) => p.id === id);
  const cur = r.preamp.v;
  let note = "";
  if (to.pre === null) {
    note = `Flat turns every band off and leaves the preamp where it is (${db(cur)}). Frequencies the current preset was cutting get louder.`;
  } else if (cur === null) {
    note = "The current preamp is unknown, so the overall level change is unknown.";
  } else if (to.pre > cur) {
    note = `Preamp rises from ${db(cur)} to ${db(to.pre)}: the overall level goes up ${(to.pre - cur).toFixed(1)} dB, before the filters shape individual frequencies.`;
  }
  S.pending = { kind: "preset", from: r.preset.v, to: id, note,
    what: `${id === r.preset.v ? "Re-apply" : "Apply"} “${presetName(id)}” to ${r.name}`,
    frames: (to.pre === null ? "" : "4 preamp frames (9c 01-04), then ") +
      "110 band frames (11 registers × 10; the inert 11th is cleared too), then commit." +
      (to.pre === null ? " No preamp frames." : "") +
      " The production build lists every frame, as toppingctl --dry-run does; this prototype only counts them." };
}

function clearPending() { S.pending = null; S.said = null; }
// Cancel on a preview ends the unlock (decision 3), unless a volume change is still open.
function endPreviewUnlock() { if (S.unlock && !anyVolumeOpen()) relock(); }

// Decision 12: a preset that raises the preamp needs the unlock when the level
// plus the rise goes above -10 dB. An unknown last-written preamp counts as loud.
function presetNeedsUnlock(r, to, level) {
  if (to.pre === null) return false;                 // Flat turns all bands off, so no band gain counts as rise
  if (r.preamp.v === null) return true;
  const rise = to.pre - r.preamp.v;
  return rise > 0 && (level === null || level + rise > SAFE_MAX);
}
// Does the staged change need the unlock? High gain always does (decision 8).
function pendingIsLoud(r, p) {
  if (p.kind === "gain") return p.to === "High";
  if (p.kind === "preset") return presetNeedsUnlock(r, PRESETS.find((x) => x.id === p.to), r.vol.v);
  return false;
}
function loudReason(r, p) {
  if (p.kind === "gain") return "high gain counts as loud";
  if (r.preamp.v === null) return "the current preamp isn't known, so this preset counts as loud";
  if (r.vol.v === null) return "the level isn't known, so this preset counts as loud";
  return `this preset would take the level above ${MINUS}10 dB`;
}

function renderPending() {
  const el = $("#pending");
  const p = S.pending;
  if (!p || S.view !== "room") { el.hidden = true; el.innerHTML = ""; S.said = null; return; }
  const r = room();
  const loud = pendingIsLoud(r, p);
  const blocked = loud && !S.unlock;
  el.hidden = false;
  el.innerHTML = `<div class="in" role="region" aria-label="Pending change">
    <div class="tag">${S.sending ? "Sending…" : "Preview · nothing sent yet"}</div>
    <div class="what num">${esc(p.what)}</div>
    ${p.note ? `<div class="banner warn">${esc(p.note)}</div>` : ""}
    ${blocked ? `<div class="banner warn">Needs “${UNLOCK_NAME}” first: ${loudReason(r, p)}.</div>` : ""}
    ${loud ? `<label class="check"><input type="checkbox" id="unlock-bar" ${S.unlock ? "checked" : ""} ${S.sending ? "disabled" : ""}>
      <span>${UNLOCK_LABEL}${r.output.hp ? " <strong>(output is headphones)</strong>" : ""}</span></label><div id="unlock-bar-note" class="why">${S.unlock ? `${S.unlockLeft} s left. The same checkbox as in DAC volume.` : ""}</div>` : ""}
    <details id="frames" ${S.framesOpen ? "open" : ""}><summary>Frames to send</summary><pre>${esc(p.frames)}</pre></details>
    <div class="acts"><button data-act="cancel" ${S.sending ? "disabled" : ""}>Cancel</button>
      <button class="primary" data-act="send" ${S.sending || blocked ? "disabled" : ""}>${S.sending ? "Sending to " + esc(r.host) + "…" : "Send to " + esc(r.name)}</button></div>
  </div>`;
  if (S.said !== p.what) { S.said = p.what; say("Preview: " + p.what + ". Nothing sent yet. Send and Cancel are after the page."); }
}
function refreshBarUnlock() {
  const n = $("#unlock-bar-note");
  if (n && S.unlock) n.textContent = `${S.unlockLeft} s left. The same checkbox as in DAC volume.`;
}

// The bar is fixed, so keep room for it under the page, whatever its height.
function padForBar() {
  const el = $("#pending");
  $(".wrap").style.paddingBottom = el.hidden ? "" : el.offsetHeight + 24 + "px";
}
if (window.ResizeObserver) new ResizeObserver(padForBar).observe($("#pending"));

// What a plan's Send depends on: volume, gain and power (the plan's default set).
// Returns the first one the device no longer matches, as the 409 would.
// Asleep, the level isn't compared: what a read returns then is unmeasured, and
// waking resumes the stored level, which the page reads after waking (Q13).
function changedElsewhere(r) {
  if (r.vol.v !== null && !asleep(r) && r.dev !== r.vol.v) return `${r.name} reads ${db(r.dev)}, not the ${db(r.vol.v)} this change started from`;
  if (r.gain.v !== null && r.devGain !== undefined && r.devGain !== r.gain.v) return `${r.name}'s gain reads ${r.devGain}, not ${r.gain.v}`;
  if (r.power.v !== null && r.devPower !== undefined && r.devPower !== r.power.v && r.power.src === "read") return `${r.name} reads ${r.devPower}, not ${r.power.v}`;
  return null;
}

// Gain, presets and power: the preview bar's Send. Volume never goes through here.
function sendPending() {
  const r = room(), p = S.pending;
  if (!writable(r)) {
    S.toast = { room: r.id, kind: "bad", html: `<strong>Not sent.</strong> ${esc(stateLine(r))} Your change is still waiting below.` };
    render(); say(plain(S.toast.html)); return;
  }
  const loud = pendingIsLoud(r, p);
  if (loud && !S.unlock) {
    S.toast = { room: r.id, kind: "bad", html: `<strong>Not sent.</strong> ${esc(r.name)}: ${loudReason(r, p)}. Tick “${UNLOCK_NAME}”, then send again.` };
    render(); say(plain(S.toast.html)); return;
  }
  const gen = S;
  S.sending = true; render();
  setTimeout(() => {
    if (S !== gen) return;
    S.sending = false;
    if (S.failNext) {
      S.failNext = false;
      S.toast = { room: r.id, kind: "bad", html: `<strong>Couldn't reach ${esc(r.host)}.</strong> Nothing was changed. Your change is still waiting below; try sending it again.` };
      render(`[data-act="send"]`); say(plain(S.toast.html)); return;
    }
    if (r.state !== "ok") {                  // the agent couldn't take the lock: 423, nothing sent
      clearPending();
      if (!anyVolumeOpen()) relock();
      S.toast = { room: r.id, kind: "bad", html: `<strong>Not sent.</strong> ${esc(stateLine(r))} Choose the change again when it's free.` };
      render(); say(plain(S.toast.html)); return;
    }
    // The agent re-reads first. Anything the change depends on that moved means 409: nothing sent.
    const moved = changedElsewhere(r);
    if (moved) {
      r.vol = { v: r.dev, src: "read", age: "just now" };
      if (r.devGain !== undefined) r.gain = { v: r.devGain, src: "read", age: "just now" };
      if (r.devPower !== undefined) r.power = { v: r.devPower, src: "read", age: "just now" };
      clearPending();
      if (loud && !anyVolumeOpen()) relock();
      S.toast = { room: r.id, kind: "bad", html: `<strong>Not sent. Changed elsewhere:</strong> ${esc(moved)}. The values below are from that read. Check them, then choose the change again.` };
      render(); say(plain(S.toast.html)); return;
    }
    clearPending();
    if (loud && !anyVolumeOpen()) relock();  // a volume change in progress keeps the checkbox
    if (p.kind === "preset") {
      const to = PRESETS.find((x) => x.id === p.to);
      r.preset = { v: p.to, src: "written", age: "just now" };
      if (to.pre !== null) r.preamp = { v: to.pre, src: "written", age: "just now" };
      S.toast = { room: r.id, kind: "info", html: `Applied “${esc(presetName(p.to))}” to ${esc(r.name)}.` +
        (p.from && p.from !== p.to ? ` <button class="link" data-act="undopreset" data-to="${p.from}">Undo (back to ${esc(presetName(p.from))})</button>` : "") };
    } else if (p.kind === "gain") {
      r.devGain = p.to;
      r.gain = { v: p.to, src: "read", age: "just now" };
      // With the earlier gain unknown there's nothing to go back to, so offer the other setting by name.
      const undo = p.from === null
        ? `<button class="link" data-act="undogain" data-to="${p.to === "High" ? "Low" : "High"}">Switch to ${p.to === "High" ? "low" : "high"} gain (the earlier gain wasn't known)</button>`
        : `<button class="link" data-act="undogain" data-to="${p.from}">Undo (preview: ${esc(p.from.toLowerCase())} gain)</button>`;
      S.toast = { room: r.id, kind: "info", html: `${esc(r.name)} is on ${esc(p.to.toLowerCase())} gain, read back from the device. ${undo}` };
    } else if (p.to === "sleep") {
      r.devPower = "Asleep";
      // What a read returns while asleep is unmeasured (plan step 2), so this is what was sent.
      r.power = { v: "Asleep", src: "written", age: "just now" };
      S.toast = { room: r.id, kind: "info", html: `${esc(r.name)} was sent to sleep. ` +
        `<button class="link" data-act="undopower" data-to="wake">Undo (preview: wake)</button>` };
    } else {
      r.devPower = "Awake";
      r.power = { v: "Awake", src: "read", age: "just now" };
      r.vol = { v: r.dev, src: "read", age: "just now" };   // Q13: read after waking
      const undo = `<button class="link" data-act="undopower" data-to="sleep">Undo (preview: sleep)</button>`;
      S.toast = r.vol.v > SAFE_MAX
        ? { room: r.id, kind: "warn", loud: true, html: `<strong>${esc(r.name)} woke at ${esc(db(r.vol.v))}</strong>, above ${MINUS}10 dB. ` +
            `<br><button class="primary" data-act="lower">Lower to ${MINUS}30 dB now</button> ${undo}` }
        : { room: r.id, kind: "info", html: `${esc(r.name)} is awake at ${esc(db(r.vol.v))}, read after waking. ${undo}` };
    }
    render(); say(plain(S.toast.html));
  }, 800);
}

function readVol(r) {
  const gen = S;
  r.reading = true; render();
  setTimeout(() => {
    if (S !== gen) return;
    r.reading = false;
    if (r.state === "busy") { render(); say(`Not read: ${r.name}'s DAC is busy.`); return; }
    if (S.readFailNext) {
      S.readFailNext = false;
      r.state = "readfail";
      r.readErr = "the settings read returned no records within 2 s (sample error)";
      ["vol", "step", "gain", "power"].forEach((k) => { r[k] = unknown("read failed"); });
      render(); say(`Read failed on ${r.name}. Values unknown.`); return;
    }
    r.state = "ok";
    r.vol = { v: r.dev, src: "read", age: "just now" };
    r.step = { v: 0.5, src: "read" };
    if (r.output.v !== null) r.output = { ...r.output, src: "read", age: "just now" };
    if (r.devGain !== undefined) r.gain = { v: r.devGain, src: "read", age: "just now" };
    if (r.devPower !== undefined && r.devPower !== "Asleep") r.power = { v: r.devPower, src: "read", age: "just now" };
    render();
  }, 900);
}

function typedSet(r) {
  const v = parseTarget(S.typed);
  if (typeof v === "string") { S.typedErr = v; refreshVolume(); return; }
  S.typedErr = "";
  request(r, v);
}

// Undo goes back through the same debounced path. Raising the level above -10 dB needs the unlock.
function undoVol(r) {
  const to = r.ui.undoTo;
  if (to === null) return;
  if (to > SAFE_MAX && to > r.vol.v && !S.unlock) {
    r.ui.err = `Going back to ${db(to)} is louder than ${MINUS}10 dB. Tick “${UNLOCK_NAME}” and undo again.`;
    refreshVolume();
    return;
  }
  request(r, to);
}

function openRoom(id) {
  S.room = id; S.view = "room"; S.more = false;   // Q5: every room opens on DAC volume
  S.pending = null; S.toast = null; S.typed = ""; S.typedErr = "";
}

function leaveRoom(r) {
  if (r && r.ui.want !== null) cancelVol(r);
  relock();
  if (r && r.ui.flight !== null) say(`Left ${r.name}. A write already being sent may still land.`);
  S.view = "list"; S.room = null; clearPending(); S.toast = null;
}

// Prototype control: the CLI on the office host takes the device lock for a while.
function cliTakesLock() {
  const r = S.rooms.find((x) => x.id === "office"), gen = S;
  if (r.state !== "ok") return;
  r.state = "busy"; r.holder = "the toppingctl CLI";
  let dropped = "";
  if (S.pending && S.room === "office" && !S.sending) {
    clearPending(); endPreviewUnlock();
    dropped = " The change you were previewing was dropped; nothing was sent.";
    S.toast = { room: r.id, kind: "warn", html: `<strong>Preview dropped.</strong> ${esc(r.name)}'s DAC became busy, so nothing was sent. Choose the change again when it's free.` };
  }
  say(`Office: DAC busy, in use by the toppingctl CLI on office.${dropped}`);
  setTimeout(() => {
    if (S !== gen || r.state !== "busy") return;
    r.state = "ok"; r.vol = { v: r.dev, src: "read", age: "just now" };
    say("Office's DAC is free again.");
    render();
  }, BUSY_MS);
}

function onAct(act, el) {
  const r = room();
  switch (act) {
    case "signin": S.view = "list"; break;
    case "signout": leaveRoom(r); S.view = "signin"; break;
    case "open": openRoom(el.dataset.id); break;
    case "back": leaveRoom(r); break;
    case "more": S.more = !S.more; break;
    case "read": return readVol(r);
    case "step": request(r, displayed(r) + Number(el.dataset.dir) * stepOf(r)); return;
    case "typed": return typedSet(r);
    case "cancelvol": cancelVol(r); return;
    case "undo": return undoVol(r);
    case "lower": return lowerNow(r);
    case "gain":
    case "undogain": stageGain(el.dataset.to); break;
    case "power":
    case "undopower": stagePower(el.dataset.to === "sleep"); break;
    case "undopreset": stagePreset(el.dataset.to); break;
    case "send": return sendPending();
    case "cancel": clearPending(); endPreviewUnlock(); break;
    case "frontpanel":
      S.rooms.find((x) => x.id === "office").dev -= 6;
      say("Office was turned down 6 dB at the front panel. The page learns it only from a read or a write.");
      break;
    case "remoteloud":
      S.rooms.find((x) => x.id === "office").dev = -6;
      say("Office was turned up to −6 dB with the remote. The page learns it only from a read or a write.");
      break;
    case "cli": cliTakesLock(); break;
    case "reset": reset(); break;
  }
  render();
}

function protoControls() {
  return `<div class="proto">
    <label class="check"><input type="checkbox" id="failnext" ${S.failNext ? "checked" : ""}><span>Make the next write fail (sample)</span></label>
    <label class="check"><input type="checkbox" id="readfailnext" ${S.readFailNext ? "checked" : ""}><span>Make the next read fail (sample)</span></label>
    <div class="row" style="flex-wrap:wrap"><button class="link" data-act="frontpanel">Turn Office down 6 dB at the front panel (sample)</button>
    <button class="link" data-act="remoteloud">Turn Office up to ${MINUS}6 dB with the remote (sample)</button>
    <button class="link" data-act="cli">The CLI takes Office's DAC for 8 s (sample)</button>
    <button class="link" data-act="reset">Reset sample data</button></div>
    <div>Prototype controls, not part of the page. Nothing here reaches a DAC.</div></div>`;
}

function render(focusSel) {
  const a = document.activeElement;
  const keep = focusSel || (a && a.id ? "#" + a.id : a && a.dataset && a.dataset.act ? `[data-act="${a.dataset.act}"]` : null);
  $("#app").innerHTML = S.view === "signin" ? viewSignin() : S.view === "list" ? viewList() : viewRoom();
  refreshVolume();
  renderPending();
  $("#proto").innerHTML = protoControls();
  padForBar();
  const el = keep ? document.querySelector(keep) : null;
  if (el && !el.disabled) el.focus();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  if (el.dataset.act === "open") e.preventDefault();
  onAct(el.dataset.act, el);
});

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "unlock" || t.id === "unlock-bar") {
    const r = room();
    if (r && t.checked) r.ui.err = "";
    setUnlock(t.checked);
    refreshVolume();
    renderPending();
    if (t.id === "unlock-bar" && $("#unlock-bar")) $("#unlock-bar").focus();
  } else if (t.id === "failnext") {
    S.failNext = t.checked;
  } else if (t.id === "readfailnext") {
    S.readFailNext = t.checked;
  } else if (t.name === "preset") {
    stagePreset(t.value);
    render(`input[name="preset"]:checked`);
  }
});

document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "slider" && room()) request(room(), parseFloat(t.value));
  else if (t.id === "tgt") { S.typed = t.value; $("#tgt-echo").textContent = echoTarget(S.typed); }
});

document.addEventListener("toggle", (e) => {
  if (e.target.id === "frames") S.framesOpen = e.target.open;
}, true);

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "tgt") {
    e.preventDefault();
    $('[data-act="typed"]').click();
  } else if (e.key === "Escape") {
    if (S.pending && !S.sending) { clearPending(); endPreviewUnlock(); render(); return; }
    const r = room();
    if (r && r.ui.want !== null) cancelVol(r);
  }
});

render();
</script>
</body>
</html>

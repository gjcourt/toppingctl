name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is not decoration: the audio nodes this tool runs on ship Debian
        # bookworm's Python 3.11, and a PEP 701 f-string slipped in unnoticed
        # because CI only ever tested the newest interpreter.
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hidapi
        run: |
          sudo apt-get update
          sudo apt-get install -y libhidapi-hidraw0 libhidapi-libusb0

      - name: Install deps
        run: pip install hid ruff

      - name: Lint
        run: ruff check .

      - name: Dry-run exercises every frame builder without hardware
        run: |
          ./toppingctl.py --dry-run vol -30
          ./toppingctl.py --dry-run gain on
          ./toppingctl.py --dry-run power off
          ./toppingctl.py --dry-run flat
          ./toppingctl.py --dry-run apply presets/bass1.json
          for f in presets/*.txt; do ./toppingctl.py --dry-run apply "$f"; done
          ./smoke.py --dry-run
          ./probe.py 0x04 0 --dry-run
          ./setctl.py --list

  # Branch protection requires a check named exactly `lint-and-dryrun`. A matrix
  # renames its check runs to `lint-and-dryrun (3.11)` etc., so that required
  # context would stop existing and every PR would be permanently unmergeable —
  # which is precisely what happened when the matrix was first added.
  #
  # This gate keeps one stable context name that aggregates the matrix, so the
  # protection rule needs no admin change and adding future interpreters cannot
  # silently break merging again.
  lint-and-dryrun:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every matrix leg to have passed
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
